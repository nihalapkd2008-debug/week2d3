<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Modern Motion UI</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <!-- IMAGE ZOOM CARD -->

    <div class="card">

      <div class="image-box">
        <img src="https://picsum.photos/400/250" alt="">
      </div>

      <div class="content">

        <h2>Explore Nature</h2>

        <p>
          Smooth hover transitions, image zoom effect,
          and modern UI motion interactions.
        </p>

        <div class="btn-group">

          <button class="btn primary-btn">
            Explore
          </button>

          <button class="btn secondary-btn">
            Learn More
          </button>

        </div>

      </div>

    </div>

    <!-- CTA SECTION -->

    <div class="cta-section">

      <h1>Start Your Journey</h1>

      <p>
        Transform-based CTA animation with smooth
        motion feedback and professional UI feel.
      </p>

      <button class="cta-btn">
        Get Started
      </button>

    </div>

  </div>

</body>
</html>
